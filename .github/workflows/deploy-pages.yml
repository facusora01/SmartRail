name: Deploy Smart Rail to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify simulation and web portal files
        run: |
          required_files=(
            "site/index.html"
            "site/ABRIR-AQUI.html"
            "site/SmartRail-1-Recorrido.html"
            "site/SmartRail-2-La-red-por-dentro.html"
            "site/SmartRail-3-Simulacion.html"
            "site/LEEME.txt"
          )
          for f in "${required_files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "Missing or empty required file: $f"
              exit 1
            fi
          done
          echo "All Smart Rail web assets verified."

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
