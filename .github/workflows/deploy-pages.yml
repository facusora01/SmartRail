name: Deploy Smart Rail to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify simulation and web portal files
        run: |
          required_files=(
            "site/index.html"
            "site/styles.css"
            "site/app.js"
            "site/ABRIR-AQUI.html"
            "site/SmartRail-1-Recorrido.html"
            "site/SmartRail-2-La-red-por-dentro.html"
            "site/SmartRail-3-Simulacion.html"
            "site/SmartRail-4-Sedes-Menores.html"
            "site/LEEME.txt"
            "site/assets/fig1-troncal.svg"
            "site/assets/fig2-estacion.svg"
            "site/assets/fig3-talleres.svg"
            "site/assets/pdf/topologia-fisica.png"
            "site/assets/pdf/sat-retiro.jpg"
            "site/assets/pdf/sat-campana.jpg"
            "site/assets/pdf/sat-san-pedro.jpg"
            "site/assets/pdf/sat-san-nicolas.jpg"
            "site/assets/pdf/sat-rosario-norte.jpg"
            "site/assets/pdf/sat-pasos-a-nivel-193.jpg"
            "site/assets/pdf/esquema-paso-nivel-854.png"
            "site/assets/pdf/esquema-piloto-20-pan.png"
            "site/assets/pdf/esquema-gabinete-borde.png"
            "site/assets/pdf/esquema-arquitectura-linea.png"
          )
          for f in "${required_files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "Missing or empty required file: $f"
              exit 1
            fi
          done
          echo "All Smart Rail web assets verified."

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
